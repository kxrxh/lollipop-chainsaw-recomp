[project]
name = "lollipop"
sdk_version = "0.10.1"
game_root = "../LollipopChainsaw-private/game"

[entrypoint]
file_path = "../LollipopChainsaw-private/game/default.xex"
out_directory_path = "../LollipopChainsaw-private/generated"
# Verified register save/restore pair in this executable's generated PPC listing.
setjmp_address = 0x82BD89D0
longjmp_address = 0x82BD8590

# Direct tail-call targets rejected by the initial v0.10.1 analysis.
[entrypoint.functions]
0x82CA8D30 = {}
0x82CBEC90 = {}
# First boot: missing indirect-call target reported by the dispatcher.
0x82A3EC70 = {}

# Missing function entries with aligned pointers confirmed in the loaded image.
# Comments identify one data reference, not an inferred function name.
0x82D218A8 = {} # 0x82063738
0x82C0FF10 = {} # 0x8203D0DC
0x828BE3C0 = {} # 0x8216E4E4
0x82B063A8 = {} # 0x8202AB9C
0x82832530 = {} # 0x8215D1A4
0x82DCE748 = {} # 0x82073060
0x8288C2F0 = {} # 0x820AB21C
0x82305038 = {} # 0x820A4E40
0x8244B068 = {} # 0x82085334
0x82AA17D0 = {} # 0x82024460
0x824366E0 = {} # 0x820D6F20
0x826616F0 = {} # 0x8212D060
