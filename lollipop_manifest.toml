# Computed function pointers: lis/addi pairs in executable code.
0x82282770 = {} # 0x82283400 / 0x82283410; also observed on boot 3
0x82439528 = {} # 0x824392F4 / 0x82439314
0x82C587B8 = {} # 0x82C5B014 / 0x82C5B028

[[entrypoint.midasm_hook]]
address = 0x829EAA14
name = "lollipop_present_interval"
registers = ["r11"]

[[entrypoint.midasm_hook]]
address = 0x8253A7E0
name = "lollipop_tick_limit"
registers = ["f1"]
after_instruction = true

[[entrypoint.midasm_hook]]
address = 0x829D0CF8
name = "lollipop_tick_trace"
registers = ["r3", "f1"]

# UWorld::IsPaused false return, after li r3,0. Native true returns stay untouched.
[[entrypoint.midasm_hook]]
address = 0x82582FE0
name = "lollipop_settings_pause"
registers = ["r3"]

# Native Options close command, before Kismet receives it.
[[entrypoint.midasm_hook]]
address = 0x8292CA54
name = "lollipop_options_command"
registers = ["r6"]

# UGFxMoviePlayer::Load: initialized owner and decoded movie-path FString.
[[entrypoint.midasm_hook]]
address = 0x82940384
name = "lollipop_watch_movie"
registers = ["r31", "r30"]

[[entrypoint.midasm_hook]]
address = 0x829411A8
name = "lollipop_unwatch_movie"
registers = ["r3", "r4"]
